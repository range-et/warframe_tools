[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warframe-tools"
version = "0.1.0"
description = "A collection of Python tools for Warframe data analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "selenium",
    "beautifulsoup4",
    "html5lib",
    "tqdm",
    "networkx",
    "matplotlib",
    "requests",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "ipython",
]

[project.scripts]
warframe-tools = "warframe_tools.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

